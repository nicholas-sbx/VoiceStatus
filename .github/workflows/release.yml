# Publish the verified 2.0.1 source from the merged main commit.
name: Release v2.0.1

on:
  push:
    branches: ["release/v2.0.1"]

permissions:
  contents: write

env:
  RELEASE_TAG: v2.0.1
  RELEASE_COMMIT: 7afdb2d545a4e344a7e19d83e3a0bf036713e575

jobs:
  widget-rendering:
    uses: ./.github/workflows/widget-tests.yml

  release:
    needs: widget-rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: VoiceServer/go.mod
          cache-dependency-path: VoiceServer/go.sum

      - name: Check versions match the tag
        run: |
          version="${RELEASE_TAG#v}"
          widget=$(jq -r .KPlugin.Version Plasmoid/metadata.json)
          if [ "$widget" != "$version" ]; then
            echo "::error::Plasmoid/metadata.json has Version $widget, tag is $RELEASE_TAG"
            exit 1
          fi
          if ! grep -q "^## $version " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test VoiceServer
        working-directory: VoiceServer
        run: go test -race ./...

      - name: Build
        run: |
          mkdir dist
          (cd Plasmoid && zip -r "../dist/VoiceStatus-$VERSION.plasmoid" .)
          for arch in amd64 arm64; do
            (cd VoiceServer && CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags="-s -w" -o "../dist/VoiceServer-linux-$arch" .)
          done
          (cd dist && sha256sum * > SHA256SUMS)
          awk -v v="$VERSION" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* --title "VoiceStatus $VERSION" --notes-file notes.md --target "$RELEASE_COMMIT"
